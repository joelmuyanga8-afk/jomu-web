    <script>
        async function syncAuthCtasForSignedInUser() {
            try {
                const response = await fetch('/php/auth_status.php', { credentials: 'same-origin' });
                if (!response.ok) return;

                const data = await response.json();
                if (!data || data.signed_in !== true) return;

                const authSelectors = [
                    "a[href='signin.html']",
                    "a[href='./signin.html']",
                    "a[href='/signin.html']",
                    "a[href='createaccount.html']",
                    "a[href='./createaccount.html']",
                    "a[href='/createaccount.html']",
                    "button[onclick*='createaccount.html']"
                ];

                document.querySelectorAll(authSelectors.join(',')).forEach((node) => {
                    const li = node.closest('li');
                    if (li) {
                        li.remove();
                    } else {
                        node.remove();
                    }
                });

                document.querySelectorAll('.offcanvas').forEach((panel) => {
                    const hasActions = panel.querySelector("a[href], button:not(.btn-close)");
                    if (hasActions) return;

                    const panelId = panel.getAttribute('id');
                    if (panelId) {
                        document.querySelectorAll(`[data-bs-target='#${panelId}']`).forEach((btn) => btn.remove());
                    }
                    panel.remove();
                });
            } catch (error) {
                // Keep default auth links when auth check is unavailable.
            }
        }

        syncAuthCtasForSignedInUser();

        async function syncSupportSiteLinks() {
            try {
                const response = await fetch('php/site_links.php', { credentials: 'same-origin' });
                if (!response.ok) return;

                const data = await response.json();
                const links = data && data.links ? data.links : {};

                document.querySelectorAll('[data-site-link]').forEach((anchor) => {
                    const key = anchor.getAttribute('data-site-link');
                    const url = typeof links[key] === 'string' ? links[key].trim() : '';
                    if (url !== '') {
                        anchor.href = url;
                    }
                });

                document.querySelectorAll('[data-site-contact]').forEach((node) => {
                    const key = node.getAttribute('data-site-contact');
                    const value = typeof links[key] === 'string' ? links[key].trim() : '';
                    if (value !== '') {
                        node.textContent = value;
                    }
                });
            } catch (error) {
                // Keep placeholder hrefs if the links cannot be loaded.
            }
        }

        syncSupportSiteLinks();
    </script>
